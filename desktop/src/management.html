<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'"><title>Connection &amp; services</title><link rel="stylesheet" href="setup.css"></head>
<body><main><span class="brand">Zera</span><h1>Connection &amp; services</h1><p id="status" role="status">Loading…</p>
<form id="connect"><h2>Central reporting</h2><label for="address">Central server</label><input id="address" type="text" placeholder="https://admin.example.com" required><label for="name">Computer name</label><input id="name" type="text" maxlength="80" required><label for="code">Enrollment code</label><input id="code" type="password" autocomplete="off" required><button>Connect</button></form>
<h2>Updates</h2><p id="update">Check for available updates.</p><button id="check">Check now</button><p><button id="download" disabled>Download update</button></p>
<form id="services"><h2>Shared server</h2><label><input id="enabled" type="checkbox">Allow other computers to connect over HTTPS</label><label for="server-address">Server address</label><input id="server-address" type="text" placeholder="https://shop.example.com:5443"><p><button type="button" id="certificate">Choose TLS certificate</button></p><p><button type="button" id="key">Choose private key</button></p><label><input id="autostart" type="checkbox">Start in the background when I sign in</label><p class="muted">The server stays running when its windows close. Signing out or quitting Zera stops it. Other computers must trust the certificate and resolve the server address.</p><button>Save &amp; restart</button></form><p id="result" role="status" aria-live="polite"></p></main><script src="management.js"></script></body></html>
