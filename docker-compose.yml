services:
  postgres:
    image: postgres:16-alpine
    container_name: zera-solutions-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zera_solutions
    ports:
      - "5432:5432"
    volumes:
      - zera_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zera_solutions"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zera_postgres_data:
